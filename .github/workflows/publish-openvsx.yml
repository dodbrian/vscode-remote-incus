name: Publish verified VSIX to Open VSX

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-openvsx
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/offline-ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out verified source and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Validate release metadata and main ancestry
        run: |
          node scripts/verify-release.cjs --tag "$GITHUB_REF"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install locked validation dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Download verified artifact from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name remote-incus-vsix --dir verified
      - name: Validate the downloaded VSIX
        run: node scripts/verify-package.cjs verified/remote-incus.vsix
      - name: Install pinned publishing CLI
        run: npm install --global ovsx@1.3.0 --ignore-scripts --no-audit --no-fund
      - name: Create namespace if absent and publish verified VSIX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVSX_PAT" || { echo 'OVSX_PAT is missing'; exit 1; }
          status=$(curl --silent --show-error --output namespace.json --write-out '%{http_code}' https://open-vsx.org/api/dodbrian)
          case "$status" in
            200) ;;
            404) ovsx create-namespace dodbrian ;;
            *) echo "Namespace lookup failed: HTTP $status"; exit 1 ;;
          esac
          ovsx verify-pat dodbrian
          ovsx publish verified/remote-incus.vsix
