name: Offline verification and VSIX

on:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check types, lint, formatting and offline regressions
        run: npm test
      - name: Verify relay with local loopback fixtures
        run: npm run test:relay
      - name: Test archive policy with synthetic fixtures
        run: npm run test:package
      - name: Test deployment guards with mocked commands
        run: npm run test:redeploy
      - name: Audit checkout privacy patterns
        run: npm run audit:privacy
      - name: Build production VSIX and verify packaged contents
        run: npm run package
      - name: Retain verified VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-incus-vsix
          path: remote-incus.vsix
          if-no-files-found: error
          retention-days: 14
